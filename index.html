<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Relay">
<meta name="theme-color" content="#3d140b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  #ui[data-screen="leaders"]{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Retro Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --blue:#a8452f; --blue-d:#8a3523; --blue-dd:#6b2618; --navy:#3d140b;
  --white:#ffffff; --yellow:#ffd23f; --yellow-d:#c99a12; --red:#e24b3b; --green:#44c45d; --gray:#4d525e; --gray-d:#383c46;
  --px:"Silkscreen","Courier New",monospace;
  --numf:"Roboto Mono",ui-monospace,Consolas,monospace;
  --body:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--blue);color:var(--white);height:100%}
body{margin:0;font:15px/1.3 var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.px{font-family:var(--px)}
#ui{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;min-height:100%}

/* --- chrome --- */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.box{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:4px 10px;font-family:var(--px);font-weight:700;font-size:14px;white-space:nowrap}
.title{font-family:var(--px);font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-shadow:0 3px 0 var(--navy)}
.title .st{color:var(--yellow);font-size:.7em;vertical-align:.12em;letter-spacing:0}
.btn{font-family:var(--px);font-weight:700;text-transform:uppercase;border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:9px 14px;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.go{background:var(--yellow);color:#241a00;border-color:#fff3b8}
.btn.red{background:var(--red)}
.btn.green{background:var(--green);color:#082010}
.btn.sm{padding:5px 9px;font-size:12px;border-width:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.icon{width:40px;height:36px;padding:0;display:grid;place-items:center;font-size:18px}
.panel{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px 12px}
.label{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#ffe0d2}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.muted{color:#ffe0d2}
.yellow{color:var(--yellow)} .good{color:#7dff95} .bad{color:#ffb3aa}
.debt{color:#ff5e4f !important}                                                  /* cash below zero */
/* numbers use a plain monospace: the pixel fonts' 5 reads as S and 0 as O */
.num,.sal,.card .age{font-family:var(--numf);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0}
.stars{color:var(--yellow);letter-spacing:1px;text-shadow:1px 1px 0 #6b4a00}
.stars .off{color:#8c93a3;text-shadow:none}
.stars .half{position:relative;display:inline-block;color:#8c93a3;text-shadow:none}
.stars .half::before{content:'★';position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--yellow);text-shadow:1px 1px 0 #6b4a00}

/* --- hub --- */
.hub{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.menu .btn{padding:14px 6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.chip{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:5px 6px;text-align:center}
.chip b{display:block;font-family:var(--px);font-size:14px}
.vs{display:flex;align-items:center;justify-content:space-around;gap:6px;margin:6px 0 10px;text-align:center}
.vs .t{display:grid;justify-items:center;gap:3px}
.vs .n{font-family:var(--px);font-size:12px;text-transform:uppercase}
.badge{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;font-family:var(--px);font-weight:700;font-size:13px;border:3px solid;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.badge.sm{width:28px;height:28px;font-size:9px;border-width:2px}

/* --- cards --- */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray);padding:0;text-align:center;box-shadow:0 4px 0 var(--navy);position:relative}
.card:active{transform:translateY(2px)}
.card .top{height:62px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.card .top img{width:56px;height:56px;image-rendering:pixelated}
.card .pos{position:absolute;left:4px;top:3px;font-family:var(--px);font-weight:700;font-size:12px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.card .age{position:absolute;right:4px;top:4px;font-family:var(--px);font-size:10px;background:rgba(0,0,0,.3);border-radius:3px;padding:1px 3px}
.card .bot{padding:4px 3px 5px;border-top:3px solid var(--white)}
.card .nm{font-family:var(--px);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fa-x{display:grid;gap:1px;margin-top:4px;font-size:12px;line-height:1.3}
.card .fa-x div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.card .fa-x span{color:#ffe0d2}
.card .fa-x b{color:var(--white);font-size:12px}
.card .fa-x .sh{display:none}                                       /* short labels, for narrow phone cards */
.card .fnm{font-family:var(--px);font-size:9px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sal{font-family:var(--px);font-size:12px}
.card.dim{opacity:.45}
.card .flag{position:absolute;inset:auto 0 0 0;background:var(--red);font-family:var(--px);font-size:10px;padding:2px}
.card:has(.flag) .bot{padding-bottom:22px}                          /* keep the flag from covering the last line */
.pc-HN,.pc-PO{background:#5eb4f0}.pc-CT,.pc-WG{background:#58c98a}.pc-DP{background:#e8604f}

.capbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.cap{flex:1;border:3px solid var(--white);border-radius:6px;background:var(--navy);padding:4px 8px}
.cap .t{font-family:var(--px);font-size:11px;text-align:center;margin-bottom:3px}
.cap .track{height:14px;background:#000;border:2px solid #000}
.cap .track i{display:block;height:100%;background:var(--yellow)}

/* --- player page --- */
.pp{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}
.pp .face{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray)}
.pp .face .top{height:120px;display:flex;align-items:flex-end;justify-content:center}
.pp .face img{width:112px;height:112px;image-rendering:pixelated}
.pp .face .bot{padding:6px;border-top:3px solid var(--white);text-align:center}
.rt{display:grid;grid-template-columns:92px minmax(0,1fr) 40px auto;align-items:center;gap:8px;margin-bottom:8px}
.rt .nm{font-family:var(--px);font-size:12px}
.posdesc{font-size:13px;line-height:1.25;color:#ffe0d2}.posdesc b{color:#fff}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.segs i{height:14px;background:var(--navy);border-radius:1px}
.segs i.on{background:var(--yellow)}
.segs i.pot{background:#5a6a9a}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:10px;color:#ffe0d2;text-align:right;padding:4px;font-weight:400}
td{padding:5px 4px;text-align:right;border-top:2px solid rgba(255,255,255,.15)}
th:first-child,td:first-child{text-align:left}
tr.me td{color:var(--yellow)}
tr.cut td{border-top:2px dashed var(--yellow)}
.brk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:min(68vh,430px);padding:6px 8px}
.bcol{display:flex;flex-direction:column;min-width:0}
.bh{font-family:var(--px);font-size:9px;color:#ffe0d2;text-align:center;white-space:nowrap;margin-bottom:3px}
.bms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:3px;min-height:0}
.bpi .bms{justify-content:space-between}
.bm{background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.22);border-radius:6px;font-size:13px;line-height:1.2;padding:1px 5px}
.bm div{display:flex;gap:5px;white-space:nowrap;overflow:hidden}
.bm .sd{opacity:.65;min-width:1.3em;text-align:right}
.bm .w{font-weight:700}.bm .l{opacity:.4}.bm .me{color:var(--yellow)}.bm .tbd{opacity:.4}
.bfin .bm{border-color:var(--yellow)}
.bchamp{text-align:center;font-family:var(--px);font-size:11px}
.bcap{font-family:var(--px);font-size:8px;color:#ffe0d2;text-align:center;margin-bottom:2px}

.sheet-bg{position:fixed;inset:0;background:rgba(30,8,4,.6);z-index:40}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(460px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;border:3px solid var(--white);border-radius:8px;background:var(--blue-d);padding:14px;box-shadow:0 6px 0 var(--navy)}
.sheet .inner{display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;background:var(--yellow);color:#241a00;font-family:var(--px);font-size:12px;padding:8px 12px;border-radius:4px;border:2px solid #fff;max-width:calc(100% - 32px);text-align:center}
input[type=text]{width:100%;background:var(--navy);border:3px solid var(--white);border-radius:6px;padding:8px;font:16px var(--body);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:4px;border:3px solid transparent;padding:0}
.sw.on{border-color:#fff}

/* --- game --- */
#game{position:fixed;inset:0;background:#0b1433;z-index:30;display:flex;align-items:center;justify-content:center}
#game[hidden]{display:none}
.stage{position:relative}
#court{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sb{display:flex;align-items:stretch;border:3px solid #fff;border-top:0;border-radius:0 0 10px 10px;background:#0b1433;font-family:var(--px);font-weight:700;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.55)}
.sb .tm{display:flex;align-items:center;gap:8px;padding:4px 10px 5px;min-width:112px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sb .tm.r{justify-content:flex-end}
.sb .ab{font-size:15px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sb .sc{font-size:28px;line-height:1;min-width:38px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sb .poss{width:8px;height:10px}
.sb .poss.on{background:var(--yellow);clip-path:polygon(0 50%,100% 0,100% 100%)}
.sb .tm.r .poss.on{clip-path:polygon(0 0,100% 50%,0 100%)}
.sb .mid{display:grid;place-items:center;align-content:center;padding:2px 12px;border-inline:3px solid #fff;min-width:78px;background:#0b1433;line-height:1.05}
.sb .q{font-size:9px;color:var(--yellow);letter-spacing:1px;white-space:nowrap}
.sb .rd{font-size:8px;color:#fff;letter-spacing:1px;white-space:nowrap}.sb .rd[hidden]{display:none}
.champ{position:relative;display:grid;justify-items:center;align-content:center;gap:8px;text-align:center;min-height:min(72vh,440px);overflow:hidden}
.champ .cup{font-size:76px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4));animation:cupin .7s cubic-bezier(.2,1.5,.4,1) both}
.champ h2{font-family:var(--px);font-size:30px;margin:0;color:var(--yellow);text-shadow:0 3px 0 #000}
.champ .cf{position:absolute;top:-12px;width:7px;height:11px;animation:cfall linear infinite;pointer-events:none}
.champ > :not(.cf){position:relative;z-index:1}
@keyframes cfall{to{transform:translateY(480px) rotate(540deg)}}
@keyframes cupin{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@media (max-height:500px){.champ{min-height:calc(100vh - 78px);gap:4px}.champ .cup{font-size:54px}.champ h2{font-size:22px}}
.sb .clk{font-size:19px;color:#fff}
.shotbox{margin-top:-1px;border:3px solid #fff;border-top:0;border-radius:0 0 6px 6px;background:#1a0d0d;color:#ff5a3c;font-family:var(--px);font-weight:700;font-size:15px;padding:0 10px 2px;min-width:44px;text-align:center;text-shadow:0 0 6px rgba(255,90,60,.6);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.shotbox:empty{display:none}
.gbtn{position:absolute;top:6px;right:6px;pointer-events:auto}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--px);font-weight:700;font-size:26px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);text-align:center;pointer-events:none;white-space:nowrap}
.banner small.big{font-size:30px;color:#fff;margin-top:6px}
.banner small{display:block;font-size:13px;color:var(--yellow);margin-top:4px}
/* Shot meter: a slim bar sitting right above the SHOOT button (between it and the basket we attack), so the
   thumb and the eyes are in the same corner. The other team's meter mirrors it bottom-left, by their basket.
   --sb: button size, --sb-r / --sb-b: button's right and bottom offsets, --mw / --mh: meter size. */
:root{--sb:138px;--sb-r:calc(12px + env(safe-area-inset-right) * .7);--sb-l:calc(12px + env(safe-area-inset-left) * .7);--sb-b:calc(12px + env(safe-area-inset-bottom) * .5);--mw:14px;--mh:150px}
.meter{position:absolute;right:calc(var(--sb-r) + (var(--sb) - var(--mw)) / 2);bottom:calc(var(--sb-b) + var(--sb) + 12px);width:var(--mw);height:var(--mh);border:2px solid #fff;border-radius:4px;background:#0b1433;pointer-events:none;box-shadow:0 2px 0 #000;overflow:visible}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:2px}
.meter .pct{position:absolute;right:calc(var(--mw) + 8px);bottom:-3px;font-family:var(--numf);font-weight:700;font-size:12px;text-shadow:0 2px 0 #000;white-space:nowrap}
.meter.right{right:auto;left:calc(var(--sb-l) + (var(--sb) - var(--mw)) / 2)}
.stats[hidden]{display:none}
.stats{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,40,.55);z-index:5}
.st-card{border:3px solid #fff;border-radius:8px;background:var(--blue-d);padding:10px 16px 12px;box-shadow:0 5px 0 var(--navy);width:min(430px,92%);display:grid;gap:6px;text-align:center}
.st-title{font-family:var(--px);font-weight:700;font-size:22px;text-shadow:0 3px 0 var(--navy)}
.st-span{font-family:var(--px);font-size:11px;color:var(--yellow);margin-top:-4px}
.st-score{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--px);font-weight:700}
.st-team{border:3px solid #fff;border-radius:5px;padding:2px 8px;font-size:14px}
.st-num{font-size:26px;min-width:40px}
.st-dash{color:#ffe0d2}
.st-table{width:100%;border-collapse:collapse;font-size:15px}
.st-table th{font-family:var(--px);font-size:11px;color:#ffe0d2;text-align:center;font-weight:400;padding:4px 6px;border-top:2px solid rgba(255,255,255,.15)}
.st-table td{padding:4px 6px;border-top:2px solid rgba(255,255,255,.15);font-variant-numeric:tabular-nums;font-family:var(--px);font-size:13px}
.st-table td.u{text-align:left}.st-table td.v{text-align:right}
.st-table .pc{color:#ffe0d2;font-size:11px}
.meter.right .pct{right:auto;left:calc(var(--mw) + 8px)}
.kitp{display:grid;gap:8px;justify-items:center}
.kitp .row{width:100%}

  ['Stanford', 'STAN', '#8c1515', '#f2f2f4', 2, 0], ['Penn State', 'PSU', '#041e42', '#f2f2f4', 2, 0], ['Minnesota', 'MINN', '#7a0019', '#ffcc33', 2, 0],
  ['Central Connecticut State', 'CCSU', '#1b4f9c', '#f2f2f4', 1, 1], ['Wagner', 'WAG', '#00483a', '#f2f2f4', 1, 1], ['Maine', 'MAINE', '#003263', '#b0d7ff', 1, 1],
  ['Monmouth', 'MONM', '#041e42', '#c9ccd6', 1, 0], ['Albany', 'ALB', '#46166b', '#eeb211', 1, 0], ['Rider', 'RID', '#981e32', '#f2f2f4', 1, 0],

const NATIONS = [['United States', 'USA', '#0a3161', '#b31942'], ['Jamaica', 'JAM', '#fed100', '#009b3a'], ['Great Britain', 'GBR', '#f2f2f4', '#012169'], ['Japan', 'JPN', '#f2f2f4', '#bc002d'],
  ['Canada', 'CAN', '#d52b1e', '#f2f2f4'], ['Italy', 'ITA', '#0066cc', '#f2f2f4'], ['South Africa', 'RSA', '#007a4d', '#ffb612'], ['China', 'CHN', '#de2910', '#ffde00']];
const school = (row, kind) => ({ name:row[0], abbr:row[1], c1:row[2], c2:row[3], tier:row[4] ?? 0, hire:!!row[5], kind });

/* ---- how fast a team is: its level is the average Speed rating of its runners (0-99) ----
   Speed turns into a 100 m best: 13.2 s at 0 down to 9.6 s at 100, so (user's benchmarks) an average high school runner
   (12.0) is about 33, state level (11.0) about 61, an elite college sprinter (10.3) about 80 and the world record 100. */
const LEVELS = {

  d2:{ area:[62, 72], stage:[[66, 73], [70, 76]] },                        // conference, D2 nationals
  d1:{ tier:[0, 69, 73, 76, 79, 82], stage:[[76, 82], [79, 84]] },         // by tier; conference, NCAA final

// the best a runner's rating can get at each level: about 10.5 in high school, 10.2 in Division 2, 9.95 in Division 1
const CAP = { hs:74, d2:82, d1:90, usa:97 };
/* The program: the level your freshmen arrive at. It starts where the school is and moves with your seasons: down 1 for

/* ---- runners: Speed (the 100), Endurance (holds it over 200 and 400, and tires less), Start (out of the blocks),
   Handoff (clean exchanges). All 1-99. ---- */
const RATE = ['spd', 'end', 'acc', 'hnd'];
const RATE_NAME = { spd:'Speed', end:'Endurance', acc:'Start', hnd:'Handoff' };
const RATE_DESC = { spd:'His 100 m. Every point is 0.036 s.', end:'Holds his speed over 200 and 400, and tires less between races.', acc:'Out of the blocks: matters on the lead-off leg.', hnd:'Cleaner baton exchanges, fewer bobbles.' };
function makeRunner(level, year = ri(0, 3)){
  const p = giveLook({ id:uid(), fn:pick(FIRST), ln:pick(LAST), num:ri(1, 99), year, tr:{} });

  const type = pick([[3, -5], [0, 0], [0, 0], [-3, 6]]);                // a pure sprinter, an all-rounder, or a quarter-miler
  p.spd = clamp(Math.round(base + type[0] + rnd(-5, 5)), 1, 99);

const squad = level => { const yrs = shuffle([0, 0, 1, 1, 2, 2, 3, 3]).slice(0, 6); return yrs.map(y => makeRunner(level, y)); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- a leg of a relay ----

          x how hard he's told to run (Easy +2.5%, All out -1.2%)
          x tiredness: nothing at full energy, about +1% at 70, +3% at 50, +6% at 30

  const start = legIdx === 0 ? .25 - r.acc * .0025 : -ev.fly;

const legCost = (r, ev, effort) => ev.cost * EFFORT[effort].cost * (1.25 - r.end / 200);
// a baton exchange: about 0.1 to 0.5 s by the two runners' Handoff, more if the incoming man is spent, and now and then a bobble
function exchange(a, b, energyAfter){

// what a team would run with this lineup, without luck: used for the projected times on the lineup screen and by the computer's coaches
function projected(team, ev, lineup){

// the computer's lineup (and your Auto button): the four with the best times for this distance as they are right now,
// quickest starter first, the fastest man on the anchor
function autoLineup(team, ev, effort = 1){

  const lead = idx.slice().sort((a, b) => b.acc - a.acc)[0], rest = idx.filter(x => x !== lead).sort((a, b) => b.t - a.t);

// run one relay for every team in the meet: returns each team's legs and total, slowest to... sorted fastest first

/* ============================ the career ============================ */
let G = null;

  else if (L === 'd2') others = D2.filter(r => r[1] !== sc.abbr).map(r => mkTeam(school(r, 'd2'), rnd(...LEVELS.d2.area)));

    others = others.slice(0, 9).map(r => mkTeam(school(r, 'd1'), LEVELS.d1.tier[r[4]] + rnd(-1.5, 1.5)));
  }

function newCareer(abbr){

const STAGES = { hs:['District', 'State', 'Nationals'], d2:['Conference', 'D2 Nationals'], d1:['Conference', 'NCAA Championships'], usa:['Olympic Games'] };

const standings = () => [...G.teams].sort((a, b) => b.pts - a.pts || (a.best.x100 || 99) - (b.best.x100 || 99));
// who is in the next meet
function nextMeetInfo(){

  if (G.phase === 'stage') { const names = STAGES[G.level], last = G.stage === names.length - 1; return { kind:'stage', title:names[G.stage], sub:last ? (G.level === 'd1' ? 'Win it and the USA team is yours' : G.level === 'usa' ? 'One shot' : 'The last meet of the season') : 'Top 3 go on' }; }

}
function startMeet(){

    big = true;
    const range = G.level === 'usa' ? LEVELS.usa.field : LEVELS[G.level].stage[G.stage];
    let opp;
    if (G.level === 'usa') opp = shuffle(NATIONS.slice(1)).slice(0, 5).map(r => mkTeam(school(r, 'nation'), rnd(...range)));
    else if (G.level === 'hs') {
      const rival = G.stage === 0 ? standings().filter(t => !t.user)[0] : null;      // district: the other team that came through your area
      opp = shuffle([...HS_AWAY]).slice(0, rival ? 4 : 5).map(r => mkTeam(school([...r.slice(0, 1).map(n => n + ' High'), ...r.slice(1)], 'hs'), rnd(...range)));

      const pool = (G.level === 'd2' ? D2 : D1).filter(r => r[1] !== G.school.abbr);
      const strong = G.level === 'd1' ? pool.filter(r => r[4] >= (G.stage ? 4 : 3)) : pool;

// run the relay that's up: the computer's coaches pick, everyone races, points and energy are booked
function raceEvent(){

}

function finishMeet(){

/* ---- the end of a season ----

   for a podium or a win at the last one. It decides who offers you a job and how good your recruits are.
   High school (user): win State and Division 2 schools call; a podium at Nationals brings the small Division 1 schools,
   winning it the next tier. College: reach the national meet and schools a tier up call, win it and two tiers up;

function endSeason(finish, reach){

  G.phase = 'off'; G.reach = reach;
  const L = G.level, offers = [];
  const hire = (rows, kind) => rows.filter(r => r[5] && r[1] !== G.school.abbr).forEach(r => offers.push(school(r, kind)));
  if (L === 'hs') {
    const podium = /Nationals/.test(finish) && reach >= 5, champ = /Nationals champions/.test(finish);
    if (G.stateWon) hire(D2, 'd2');
    if (podium) hire(D1.filter(r => r[4] === 1), 'd1');
    if (champ) hire(D1.filter(r => r[4] === 2), 'd1');
  } else if (L === 'd2') {
    if (reach >= 3) hire(D1.filter(r => r[4] === 1), 'd1');
    if (/champions/.test(finish)) hire(D1.filter(r => r[4] === 2 || r[4] === 3), 'd1');
  } else if (L === 'd1') {

    if (reach >= 3) hire(D1.filter(r => r[4] === tier + 1), 'd1');

// take a job: a new school, its runners, a new region. You never go back down a level.
function takeJob(sc){

  G.prog = G.prog0 = sc.kind === 'd2' ? rnd(64, 69) : LEVELS.d1.tier[sc.tier] + rnd(-1, 1);
  G.roster = squad(G.prog);
  G.offers = []; G.newJob = true;
}
// recruits: freshmen around your program's level, better after a deep run. You pick one for every open spot.
function recruitClass(){
  const open = G.roster.filter(r => r.year >= 3).length;
  G.off.picks = open; G.off.class = Array.from({ length:open + 3 }, () => makeRunner(G.prog + rnd(-3, 4) + 4, 0));   // +4: makeRunner takes 4 off a freshman
}
function nextSeason(){

  else {
    if (!G.newJob) {                                                  // seniors out, everyone up a year, the recruits you signed in

      G.roster.push(...((G.off && G.off.signed) || []));

    }
    G.newJob = false;
    if (G.usaNext) {                                                  // NCAA champions: the national team for one meet
      G.usaNext = false; G.college = { school:G.school, level:G.level, roster:G.roster };
      G.school = school(NATIONS[0], 'nation'); G.level = 'usa'; G.roster = Array.from({ length:6 }, () => makeRunner(LEVELS.usa.you, 2));

function buildLeagueUSA(){ G.teams = [{ ...G.school, id:'USA', user:true, roster:G.roster, base:0, pts:0, meets:0, best:{} }]; }

const trainCost = (r, k) => 2 + (r.tr[k] || 0) + Math.max(0, Math.floor((r[k] - 55) / 5));

/* ============================ saving ============================ */
// three separate careers, kept on this device
const SLOTS = 3, slotKey = n => `retrorelay.slot${n}`;

function slotInfo(n){ const raw = slotRaw(n); if (!raw) return null; try { const g = JSON.parse(raw); return g && g.school ? g : null; } catch { return null; } }
function save(){ if (!SLOT || !G) return; try { localStorage.setItem(slotKey(SLOT), JSON.stringify(G)); } catch {} }
function resetSlot(n){ try { localStorage.removeItem(slotKey(n)); } catch {} }

function relink(){
  const t = G.teams.find(t => t.user); if (t) t.roster = G.roster;
  if (G.meet) G.meet.teams.forEach(mt => { if (mt.user) mt.roster = G.roster; else { const lt = G.teams.find(x => x.id === mt.id); if (lt) mt.roster = lt.roster; } });
}
function openSlot(n){ SLOT = n; G = slotInfo(n); if (G) relink(); screen = 'hub'; pickedTeam = null; render(); }

/* ============================ portraits ============================ */
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v * (1 + k)), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const portraitCache = {};
function portrait(p, c1){
  const key = [p.id, c1, p.style, p.skin, p.hair].join('|');
  if (portraitCache[key]) return portraitCache[key];
  const S = 20, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'), f = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  const O = '#1a1426', sh = shade(p.skin, -.16), hi = shade(p.skin, .12), H = p.hair;
  const st = p.style === 'headband' ? 'bald' : p.style, band = p.style === 'headband';
  f(2, 15, 16, 5, O); f(3, 16, 14, 4, p.skin); f(6, 16, 8, 4, c1); f(8, 16, 4, 1, p.skin);   // bare shoulders and a singlet
  f(8, 13, 4, 3, O); f(9, 13, 2, 3, p.skin);                                // neck
  f(5, 3, 10, 11, O); f(6, 4, 8, 9, p.skin); f(5, 7, 1, 3, p.skin); f(14, 7, 1, 3, p.skin);
  if (st === 'bald') f(8, 4, 3, 1, hi);                                      // shine
  if (st === 'fade') { f(6, 3, 8, 2, H); f(6, 5, 1, 2, sh); f(13, 5, 1, 2, sh); }
  if (st === 'afro') { f(4, 1, 12, 5, O); f(5, 1, 10, 5, H); f(4, 5, 2, 3, H); f(14, 5, 2, 3, H); }
  if (st === 'curly') { f(5, 2, 10, 4, O); f(6, 2, 8, 3, H); [6, 8, 10, 12].forEach(x => f(x, 1, 1, 1, H)); f(5, 5, 1, 2, H); f(14, 5, 1, 2, H); }
  if (band) { f(5, 5, 10, 1, O); f(6, 5, 8, 1, '#ffffff'); }
  f(7, 8, 2, 1, '#ffffff'); f(11, 8, 2, 1, '#ffffff'); f(8, 8, 1, 1, O); f(12, 8, 1, 1, O);
  f(7, 7, 2, 1, O); f(11, 7, 2, 1, O);
  f(9, 10, 2, 1, 'rgba(0,0,0,.25)');
  f(8, 11, 4, 1, '#8a3b2e');
  return portraitCache[key] = cv.toDataURL();
}

/* ============================ UI ============================ */
let screen = 'hub', sel = null, pickedTeam = null;
const LEVEL_NAME = { hs:'High school', d2:'Division 2', d1:'Division 1', usa:'Team USA', nation:'Olympics' };
const badge = (t, cls = '') => `<div class="badge ${cls}" style="background:${t.c1};border-color:${t.c2};color:${t.c2}">${esc(t.abbr.slice(0, 4))}</div>`;
const chipDot = t => `<i class="dot" style="background:${t.c1};border-color:${t.c2}"></i>`;
const backBtn = `<button class="btn sm" data-a="go" data-s="hub">Back</button>`;
function topBar(title, right = ''){
  return `<div class="bar"><div class="box num">${G.tp} <span class="yellow">TP</span></div><div class="title">${title}</div><div class="row" style="gap:6px">${right}</div></div>`;
}
const enColor = en => en > 75 ? '#44c45d' : en > 50 ? '#ffd23f' : en > 25 ? '#f08a24' : '#e24b3b';
const enBar = en => `<div class="en"><i style="width:${Math.round(en)}%;background:${enColor(en)}"></i></div>`;
const short = r => `${r.fn[0]}. ${r.ln}`;

function render(){
  const ui = $('#ui');
  let s = screen, f;
  if (SLOT === null) { s = 'slots'; f = slotsHTML; }
  else if (!G) { s = 'create'; f = createHTML; }
  else if (G.meet) { s = G.meet.watching ? 'result' : 'lineup'; f = s === 'result' ? resultHTML : lineupHTML; }
  else if (G.last && !G.last.seen) { s = 'post'; f = postHTML; }
  else if (G.phase === 'off') { s = 'off'; f = offHTML; }
  else { f = { squad:squadHTML, runner:runnerHTML, table:tableHTML, records:recordsHTML }[s]; if (!f) { s = 'hub'; f = hubHTML; } }
  ui.innerHTML = f();
  ui.dataset.screen = s; window.scrollTo(0, 0); ui.scrollTop = 0;
}

function slotsHTML(){

    if (!g) return `<div class="panel slot"><div class="label">Career ${n}</div><div class="slot-empty muted">Empty</div>
      <button class="btn go" data-a="slotPlay" data-n="${n}">New career</button></div>`;
    return `<div class="panel slot"><div class="label">Career ${n}</div>
      <div class="row" style="gap:8px">${badge(g.school, 'sm')}<div class="grow" style="min-width:0"><div class="px slot-team">${esc(g.school.name)}</div><div class="muted" style="font-size:12px">${LEVEL_NAME[g.level]}</div></div></div>
      <div class="slot-meta num"><span>Season ${g.season}</span><span>${g.gold ? g.gold + ' gold' : (g.titles || 0) + ' titles'}</span></div>
      <div class="row" style="gap:6px"><button class="btn go grow" data-a="slotPlay" data-n="${n}">Coach</button><button class="btn red sm" data-a="slotReset" data-n="${n}">Reset</button></div></div>`;

/* ---- the meet: pick four, their order and how hard each one runs ---- */
function lineupHTML(){
  const M = G.meet, ev = EVENTS[M.ev], T = M.teams.find(t => t.user), L = G.lineup ||= [null, null, null, null];
  const rows = T.roster.map((r, i) => { const en = T.energy[r.id], leg = L.findIndex(x => x && x.i === i), slow = legTime(r, ev, 1, 1, en) - legTime(r, ev, 1, 1, 100);
    return `<button class="rrow ${leg >= 0 ? 'on' : ''}" data-a="pickR" data-i="${i}"><img src="${portrait(r, G.school.c1)}" alt="">
      <span class="nm">${esc(short(r))} <span class="yr">${YEARS[r.year]}</span></span>
      <span class="num pb">${fmt(pbOf(r, ev.leg))}${slow >= .05 ? `<small>+${slow.toFixed(2)}</small>` : ''}</span>
      ${enBar(en)}<span class="tag ${leg >= 0 ? '' : 'off'}">${leg >= 0 ? 'LEG ' + (leg + 1) : ''}</span></button>`; }).join('');
  const full = L.every(Boolean);
  const legs = L.map((x, i) => { const what = ['Start', 'Leg 2', 'Leg 3', 'Anchor'][i];
    if (!x) return `<div class="leg empty"><span class="label">${what}</span><span class="muted">Tap a runner</span></div>`;
    const r = T.roster[x.i], en = T.energy[r.id], after = clamp(en - legCost(r, ev, x.effort), 0, 100);
    return `<div class="leg"><span class="label">${what}</span><button class="lname" data-a="dropLeg" data-l="${i}">${esc(short(r))}<span class="after" style="color:${enColor(after)}">${Math.round(en)} to ${Math.round(after)}</span></button>
      <button class="btn sm eff e${x.effort}" data-a="effort" data-l="${i}">${EFFORT[x.effort].name}</button><b class="num">${fmt(legTime(r, ev, i, x.effort, en))}</b></div>`; }).join('');
  return `<div class="bar"><div class="box">Race ${M.ev + 1}/3</div><div class="title">${ev.name} <span class="st">${esc(M.title)}</span></div><div class="box num">${T.pts} <span class="yellow">PTS</span></div></div>
    <div class="lu"><div class="panel rlist"><div class="rhead label"><span></span><span>Runner</span><span>${ev.leg} m best</span><span>Energy</span><span></span></div>${rows}</div>
    <div class="panel legs">${legs}
      <div class="row between"><span class="label">Projected</span><b class="num" style="font-size:16px">${full ? fmt(projected(T, ev, L)) : '-'}</b></div>
      <div class="row" style="gap:6px"><button class="btn sm" data-a="auto">Auto</button><button class="btn sm" data-a="clear">Clear</button><button class="btn go grow" data-a="race" ${full ? '' : 'disabled'}>Race</button></div></div></div>`;
}
function resultHTML(){
  const M = G.meet, ev = EVENTS[M.ev], res = M.last, mine = res.find(o => M.teams[o.ti].user);
  const rows = res.map(o => { const t = M.teams[o.ti]; return `<tr class="${t.user ? 'me' : ''}"><td class="num">${o.place}</td><td class="tl"><span class="trow">${chipDot(t)}${esc(t.name)}</span></td><td class="num">${fmt(o.total)}</td><td class="num">+${o.pts}</td><td class="num">${t.pts}</td></tr>`; }).join('');
  const legs = mine.legs.map((l, i) => `<div class="split"><span class="nm">${i + 1}. ${esc(l.name)}${l.bobble ? ' <span class="bad">bobbled</span>' : ''}</span><b class="num">${fmt(l.t)}</b>${enBar(l.after)}</div>`).join('');
  const next = M.ev + 1 < EVENTS.length ? `Next: ${EVENTS[M.ev + 1].name}` : 'Meet results';
  return `<div class="bar"><div class="box">Race ${M.ev + 1}/3</div><div class="title">${ev.name} results</div><span></span></div>
    <div class="two wide"><div class="panel"><table><tr><th>#</th><th style="text-align:left">Team</th><th>Time</th><th>Pts</th><th>Meet</th></tr>${rows}</table></div>
    <div class="panel stackp"><div class="px place">${ordinal(mine.place)} <span class="num">${fmt(mine.total)}</span></div><div class="row" style="gap:6px">${mine.tp ? `<div class="tag">+${mine.tp} TP</div>` : ''}${mine.record ? '<div class="tag">Program record</div>' : ''}</div>
      <div class="label">Your splits and what's left in the tank</div>${legs}
      <button class="btn go" data-a="next">${next}</button></div></div>`;
}

  const L = G.last;

/* ---- sheets / toast ---- */
let closeFn = null;
function openSheet(html, mount){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog');
  sh.innerHTML = `<div class="inner">${html}</div>`;
  document.body.append(bg, sh);
  closeFn = () => { bg.remove(); sh.remove(); closeFn = null; };
  bg.onclick = closeSheet; mount?.(sh);
}
function closeSheet(){ closeFn?.(); }
let toastT;
function toast(m){ document.querySelector('.toast')?.remove(); clearTimeout(toastT); const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; document.body.append(e); toastT = setTimeout(() => e.remove(), 2600); }
function confirmSheet(text, yes, onYes){
  openSheet(`<div style="font-size:15px">${text}</div><div class="row" style="gap:8px"><button class="btn grow" id="cNo">Cancel</button><button class="btn go grow" id="cYes">${yes}</button></div>`,
    sh => { sh.querySelector('#cNo').onclick = closeSheet; sh.querySelector('#cYes').onclick = () => { closeSheet(); onYes(); }; });
}

/* ---- every button ---- */
function offFinish(){ nextSeason(); screen = 'hub'; save(); render(); }
function offRecruit(){
  if (G.newJob || G.level === 'usa') return offFinish();
  recruitClass(); G.off.sel = [];
  if (!G.off.picks) return offFinish();
  G.off.step = 'recruit'; save(); render();
}
const ACT = {

/* ============================ runner sprites ============================

   and two-part legs. Running is an 8-frame sprint cycle (user): the knee drives up folded, the leg reaches, lands
   under the body, pushes off behind and the heel kicks up; the arms pump opposite the legs; there are two moments per

  marks:{ th:1.25, legs:[[1, 2], [.1, 1.75]], arms:[[0, 0], [.12, 0]] },           // on your marks: back knee down, hands on the line

/* ============================ watching the race ============================
   A standard 400 m track seen from the home-straight side: two 100 m straights and two 100 m bends in lane 1, and every
   lane out is 7.5 m longer per lap (user), all of it in the bends. So races start staggered: lane 1 on the line, lane 2
   7.5 m round the first bend, lane 6 37.5 m round it. The 4x100 stays in lanes all the way; in the 4x200 and 4x400
   the first lap is in lanes and after it everyone runs in lane 1 (user).
   Runners cover the same number of screen pixels per metre on the bends as on the straights (user): the bends are
   drawn long enough for that, and a runner's place on a bend is worked out by distance along it, not by angle.
   The camera slides along with your runner on the straights and sits still while he's on a bend (user).
   Nothing here decides anything: the times were set when you pressed Race. */
const CH = 180, SS = 6, LS = 300, RX0 = 128, RY0 = 30, WX = 5.5, WY = 7, LANES = 6, PAD = 12;
const RXO = RX0 + LANES * WX, RYO = RY0 + LANES * WY, XL = PAD + RXO, XR = XL + LS, CY = 106, WORLD_W = XR + RXO + PAD;

const arcCache = {};
function arcAngle(rx, ry, s){

  return Math.PI * (lo + (want - t[lo]) / (t[hi] - t[lo] || 1)) / N;

// where lane k (0 = lane 1; fractions are between lanes) is at u of the way round the lap: quarters are the first bend

function lanePos(k, u){

  if (q === 0) { const a = arcAngle(rx, ry, s); return { x:XR + rx * Math.sin(a), y:CY + ry * Math.cos(a), dx:Math.cos(a) }; }

function uOf(k, d){

function buildTrack(title, ev){

  const g = c.getContext('2d'); g.scale(SS, SS);

  for (let x = 0; x < WORLD_W; x += 24) { g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(x, 0, 12, CH); }
  // the stand along the back straight
  g.fillStyle = '#2a2f45'; g.fillRect(0, 0, WORLD_W, 27); g.fillStyle = '#1b2033'; g.fillRect(0, 27, WORLD_W, 3);

  for (let y = 3; y < 26; y += 4) for (let x = (y % 8 ? 1 : 3); x < WORLD_W; x += 4) if (Math.random() < .82) { g.fillStyle = pick(crowd); g.fillRect(x, y, 2, 2); }

  cv.style.width = Math.floor(CW * s) + 'px'; cv.style.height = Math.floor(CH * s) + 'px';

/* ---- the baton exchange (user's numbers) ----
   The next man waits on his mark. When the man with the baton has GO_AT (10) metres left to that mark he takes off, and
   the 10 m between them closes slowly: the baton changes hands ZONE (15) metres past the mark with both at full speed,
   the new man an arm's length (REACH) ahead. The man who handed it on then eases down and stops about 25 m later,

  // how each man covers his ground: the lead-off builds speed out of the blocks; the others are already moving
  // (a slow or bobbled exchange shows as a stutter right after it)
  const prof = legs.map((l, i) => {
    if (i === 0) { const c = clamp(1.3 / H[1], .01, .3), e = 1 - c * (1 - Math.exp(-1 / c)); return s => (s - c * (1 - Math.exp(-s / c))) / e; }
    const q = 1 + clamp(l.loss / l.t, 0, .2); return s => Math.pow(s, q); });
  const pos = (i, T) => a[i] + (b[i] - a[i]) * prof[i](clamp((T - H[i]) / (H[i + 1] - H[i]), 0, 1));
  const vE = legs.map((l, i) => { const e = (H[i + 1] - H[i]) * .01; return (b[i] - pos(i, H[i + 1] - e)) / e; });   // his speed as he hands over
  const go = [0];                                                     // when each man takes off
  for (let i = 1; i < 4; i++) { let lo = H[i - 1], hi = H[i]; for (let n = 0; n < 32; n++) { const m = (lo + hi) / 2; pos(i - 1, m) < i * L - GO_AT ? lo = m : hi = m; } go[i] = lo; }
  return { t, user:t.user, lane:t.lane, U:{ J:t.c1, P:t.c2 }, runners:t.lineup.map(x => t.roster[x.i]), total:o.total, place:o.place,
    H, a, b, pos, vE, go, ph:[0, 1, 2, 3].map(() => Math.random()), lx:[null, null, null, null] };
}
// where man i of a team is at race time T: metres raced and what he's doing
function runnerAt(tm, i, T){
  const L = R.ev.leg, { H, a, b, go } = tm;
  if (T >= H[i + 1] && R.T > 0) {                                     // handed on, or finished: ease down and stop
    const td = 2 * EASE / tm.vE[i], s = clamp((T - H[i + 1]) / td, 0, 1);
    return { m:b[i] + EASE * (1 - (1 - s) * (1 - s)), st:s < 1 ? 'slow' : 'done', s, since:(T - H[i + 1] - td) / R.speed };
  }
  if (T >= H[i]) { if (R.T <= 0) return { m:0, st:'blocks' }; const m = tm.pos(i, T); return { m, st:'carry', s:(T - H[i]) / (H[i + 1] - H[i]), left:b[i] - m }; }
  if (T >= go[i]) { const s = (T - go[i]) / (H[i] - go[i]); return { m:i * L + (ZONE + REACH) * Math.pow(s, (GO_AT + ZONE) / (ZONE + REACH)), st:'go', s }; }
  return { m:i * L, st:'wait' };
}
const smooth = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
// a point on the screen for man i at m metres raced: in his own lane for the first lap, then in lane 1, except that he
// takes and gives the baton out in his team's lane and cuts in and out over about 30 m
function place(tm, i, m){
  const K = tm.lane;
  if (R.ev.leg === 100 || tm.a[i] < 400) return lanePos(K, uOf(K, LANE_M * K + m));
  const inside = K * .2;                                              // the pack fans out a little so they don't run through each other
  let lat = K + (inside - K) * smooth((m - tm.a[i] - 5) / 30);
  if (i < 3) lat += (K - lat) * smooth((m - (tm.b[i] - 45)) / 30);
  // these exchanges are at the start of a bend, out in the team's lane, where a metre covers less of the bend than it
  // does in lane 1: count it that way through the exchange so the two men stay the right distance apart
  const wide = Math.max(1 - smooth((m - tm.a[i]) / 40), i < 3 && m >= tm.b[i] - ZONE ? 1 : 0);
  const d = (((m - 400) % 400) + 400) % 400, q = Math.floor(d / 100);
  let f = d / 100 - q; if (q % 2 === 0) f *= 1 - wide + wide * 100 / (100 + LANE_M / 2 * lat);
  return lanePos(lat, Math.min(.99999, (q + f) / 4));
}
function startRace(){
  const M = G.meet, ev = EVENTS[M.ev], res = M.last;
  R = { ev, T:0, real:0, over:0, called:false, speed:1 };              // every race starts at real speed (user); the button steps 1x, 2x, 4x, 8x
  $('#spdBtn').textContent = '1x';
  R.teams = res.map(o => raceTeam(o, M.teams[o.ti], ev));
  R.end = Math.max(...R.teams.map(t => t.total));
  trackCv = buildTrack(M.big ? M.title.toUpperCase().replace(/[^A-Z0-9 ]/g, '') : 'RETRO RELAY', ev);
  $('#evn').textContent = ev.name; $('#clk').textContent = '0.00'; $('#order').innerHTML = '';
  $('#game').hidden = false; fit();
  cam = null; lastT = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function endRace(){
  cancelAnimationFrame(raf); R = null; banner(''); $('#game').hidden = true; render();
}
// metres the baton has gone
const batonAt = (tm, T) => { if (T >= tm.total) return 1e5 - tm.total; let i = 0; while (i < 3 && T >= tm.H[i + 1]) i++; return tm.pos(i, T); };
let orderT = 0;
function update(dt){
  R.real += dt;
  if (R.real < 1.1) banner('On your marks');
  else if (R.real < 2.1) banner('Set');
  else {
    if (R.T === 0) banner('');
    R.T += dt * R.speed;
    const mine = R.teams.find(t => t.user);
    if (!R.called && R.T >= mine.total) { R.called = true; banner(ordinal(mine.place), fmt(mine.total)); }
    if (R.T >= R.end) { R.over += dt; if (R.over > 2.6) return endRace(); }
  }
  $('#clk').textContent = fmt(Math.min(R.T, R.end));
  if ((orderT -= dt) <= 0) { orderT = .2;
    const ord = [...R.teams].sort((a, b) => batonAt(b, R.T) - batonAt(a, R.T));
    $('#order').innerHTML = ord.map((tm, k) => `<span class="och ${tm.user ? 'me' : ''}">${k + 1}<i style="background:${tm.t.c1};border-color:${tm.t.c2}"></i>${esc(tm.t.abbr.slice(0, 4))}</span>`).join(''); }
}
function draw(dt){
  const ents = [], T = R.T, L = R.ev.leg;
  let focus = null;
  for (const tm of R.teams) {
    let cur = 0; while (cur < 3 && T >= tm.H[cur + 1]) cur++;
    for (let i = 0; i < 4; i++) {
      const s = runnerAt(tm, i, T);
      let alpha = 1, o;
      if (s.st === 'wait') {
        if (!(i === cur + 1 || L === 100)) continue;
        if (L !== 100) alpha = clamp((T - tm.H[i - 1]) / R.speed / .5, 0, 1);       // he walks out when the leg before his starts
        o = { pose:i === cur + 1 && i * L - batonAt(tm, T) < 45 ? 'ready' : 'stand' };
      } else if (s.st === 'blocks') o = { pose:R.real < 1.1 ? 'marks' : 'set', baton:true };
      else if (s.st === 'done') {
        if (L !== 100 && i < 3) { alpha = clamp(1.6 - s.since, 0, 1); if (alpha <= 0) continue; }   // off the track before the others come round again
        o = { pose:'stand', baton:i === 3 };
      } else {
        // how fast his legs go follows how fast he's moving, up to a sprint cadence the eye can still read
        const moved = tm.lx[i] === null ? 0 : s.m - tm.lx[i], cad = dt > 0 ? clamp(moved / dt / 4.4, 1.3, 4.2) : 0;
        tm.ph[i] = (tm.ph[i] + dt * cad) % 1;
        o = { f:Math.floor(tm.ph[i] * 8) % 8, arm:'pump', lean:3 };
        if (s.st === 'carry') { o.baton = true; o.lean = i === 0 ? (s.m < 6 ? 5 : s.m < 16 ? 4 : 3) : 3; if (i < 3 && s.left < 5) o.arm = 'fwd'; }
        else if (s.st === 'go') { o.lean = s.s < .55 ? 4 : 3; if (s.s > .62) o.arm = 'back'; }
        else { o.lean = s.s < .35 ? 2 : s.s < .75 ? 1 : 0; o.baton = i === 3; }
      }
      tm.lx[i] = s.m;
      const p = place(tm, i, s.m);
      const e = { x:p.x, y:p.y, face:p.dx >= 0 ? 1 : -1, spr:figure(tm.runners[i], tm.U, o), alpha, mark:tm.user && !!o.baton };
      ents.push(e);
      if (tm.user && (i === cur) && (s.st === 'carry' || s.st === 'blocks' || i === 3)) focus = e;
    }
  }
  if (focus) { const want = clamp(focus.x - CW / 2, 0, WORLD_W - CW); cam = cam === null ? want : cam + (want - cam) * Math.min(1, dt * 7); }
  if (cam === null) cam = WORLD_W - CW;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(trackCv, Math.round(cam * SS), 0, CW * SS, CH * SS, 0, 0, CW * SS, CH * SS);
  ctx.setTransform(SS, 0, 0, SS, -Math.round(cam * SS), 0);
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    ctx.globalAlpha = e.alpha * .28; ctx.fillStyle = '#000'; ctx.fillRect(e.x - 3.5, e.y - .8, 7, 1.6);
    ctx.globalAlpha = e.alpha;
    ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face * FIG, FIG); ctx.drawImage(e.spr, -HX, -GROUND); ctx.restore();
    if (e.mark) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(e.x - 2, e.y - 19, 4, 1); ctx.fillRect(e.x - 1, e.y - 18, 2, 1); }
  }
  ctx.globalAlpha = 1;
}
function loop(now){
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = now;
  update(dt); if (R) { draw(dt); raf = requestAnimationFrame(loop); }
}
$('#skipBtn').addEventListener('click', () => { if (R) endRace(); });
$('#spdBtn').addEventListener('click', () => { if (!R) return; R.speed = R.speed >= 8 ? 1 : R.speed * 2; $('#spdBtn').textContent = R.speed + 'x'; });

/* ============================ boot ============================ */
render();
})();
</script>
